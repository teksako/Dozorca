<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <title>SELT</title>
    <script src="http://code.jquery.com/jquery-1.9.1.js"></script>
</head>

<body>
<!--HEADER-->
<div th:replace="navbar :: navbar"></div>
<div class="container">
    <form th:action="@{/saveLaptop}" th:object="${laptop}" method="post">
        <p class="error" th:text="${commonErrro}"></p>

        <td>Producent:</td>
        <input id="laptopManufacturer" type="text" th:field="*{manufacturer}">
        <td>Model:</td>
        <input id="laptopModel" type="text" th:field="*{model}">
        <td>Numer seryjny:</td>
        <input id="laptopSerial" type="text" th:field="*{serialNumber}">
        <td>MAC adres:</td>
        <input id="macAdress" type="text" th:field="*{MACAdress}">
        <td>IP adres:</td>
        <input id="IPAdress" type="text" th:field="*{IPAdress}">
        <td>Hostname:</td>
        <input id="hostname" type="text" th:field="*{hostname}">


        <td>Klucz Office</td>

        <select name="officeKey" id="officeKey" th:field="*{officeKey}">
            <!--<select name="replacement person" id="replacement" th:field="*{replacement}" placeholder="replacement">-->
            <option value="">Wybierz:</option>
            <option th:each="Key : ${officeKeys}"
                    th:value="${Key.id}"
                    th:text="${Key.officeVersion+ '  '+ Key.officeKey}"></option>
        </select>
        </td>

        <td>Użytkownik</td>

        <select name="employee" id="employee" th:field="*{employee}">
            <!--<select name="replacement person" id="replacement" th:field="*{replacement}" placeholder="replacement">-->
            <option value="">Wybierz:</option>
            <option th:each="Key : ${employeesList}"
                    th:value="${Key.id}"
                    th:text="${Key.firstname+ '  '+ Key.lastname}"></option>
        </select>
        </td>

        <input type="hidden" th:field="*{id}" />
        <br>
        <input type="button" value="Powrót" name="backButton"
               onClick="javascript:window.location.href='/index'" class="myButton shortButton">
        <input type="submit" value="Zapisz" name="saveButton" class="mySubmitButton">
    </form>
</div>
</body>
</html>
